services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: crowned_connections
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowned_connections"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      bash -c "
      docker-entrypoint.sh postgres &
      until pg_isready -U postgres -d crowned_connections; do sleep 1; done;
      psql -U postgres -d crowned_connections -f /database/001_schema.sql;
      psql -U postgres -d crowned_connections -f /database/seed.sql;
      wait
      "
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_schema.sql:/database/001_schema.sql:ro
      - ./database/seed/seed.sql:/database/seed.sql:ro

volumes:
  postgres_data: