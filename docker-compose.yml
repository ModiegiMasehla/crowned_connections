services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: crowned_connections
      POSTGRES_USER: crowned
      POSTGRES_PASSWORD: crowned
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
      - ./database/seed/seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowned -d crowned_connections"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://crowned:crowned@db:5432/crowned_connections
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/db-init.js && node dist/server.js"]

volumes:
  pgdata:
