# Crowned Connections: local development and integration stack.
#
#   docker compose up --build --wait          start the database and API
#   docker compose --profile smoke run --rm smoke        API smoke test
#   docker compose --profile test run --rm flutter-tests Flutter analyze + tests
#
# Settings come from .env (copy .env.example). Every value has a development
# default, so the stack also starts without one. For production use
# docker-compose.prod.yml instead: it has no seed data and no defaults.

name: crowned-connections

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowned_connections}
      POSTGRES_USER: ${POSTGRES_USER:-crowned}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowned}
    # Bound to this machine only. The API reaches the database over the
    # internal network, so nothing else needs this port.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run by the Postgres image in file-name order, only when the data
      # volume is empty. To re-run them: scripts/reset-db.sh
      - ./database/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./backend
      target: runtime
    image: crowned-connections-api:dev
    restart: unless-stopped
    environment:
      PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-crowned_connections}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-crowned}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-crowned}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-use-a-long-random-secret}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    # The health check itself is defined in backend/Dockerfile (GET /health).

  # --- Optional tools: only started when their profile is requested ---

  # API smoke test against the running stack (see scripts/smoke-test.sh).
  smoke:
    profiles: ["smoke"]
    image: alpine:3.20
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:5000
    volumes:
      - ./scripts/smoke-test.sh:/smoke-test.sh:ro
    command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /smoke-test.sh"]

  # Flutter analyzer and tests in a clean container.
  flutter-tests:
    profiles: ["test"]
    build:
      context: ./mobile
      dockerfile: ../docker/flutter-test.Dockerfile
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.24.5}
    image: crowned-connections-flutter-tests:dev

volumes:
  pgdata:
